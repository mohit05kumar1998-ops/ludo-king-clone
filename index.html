<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludo Engine Live</title>
    <!-- Free Game Engine & WebRTC Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b1a30; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; font-family: sans-serif; }
        #game-container { width: 100vw; max-width: 450px; height: 100vh; max-height: 800px; position: relative; }
        
        /* Secret Remote Modal */
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; display: none; justify-content: center; align-items: center; }
        .modal-body { background: #111; border: 2px solid #ffd700; border-radius: 10px; width: 85%; padding: 15px; color: #fff; text-align: center; }
        .num-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 10px 0; }
        .num-btn { background: #ffd700; border: none; padding: 10px 0; font-weight: bold; border-radius: 4px; cursor: pointer; color: #000; }
        .input-box { width: 100%; padding: 8px; margin: 8px 0; border-radius: 4px; border: none; }
        .action-btn { background: #0084ff; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <!-- Hidden Remote Admin Panel -->
    <div class="modal" id="admin-modal">
        <div class="modal-body">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>Secret Remote Panel</h3>
                <span id="close-modal" style="cursor:pointer; font-size:24px;">&times;</span>
            </div>
            <p style="font-size:12px; color:#ffd700; margin-top:8px;">Force Next Dice Roll:</p>
            <div class="num-grid">
                <button class="num-btn" data-v="1">1</button>
                <button class="num-btn" data-v="2">2</button>
                <button class="num-btn" data-v="3">3</button>
                <button class="num-btn" data-v="4">4</button>
                <button class="num-btn" data-v="5">5</button>
                <button class="num-btn" data-v="6">6</button>
            </div>
            <div style="font-size:11px; margin-top:10px;">
                <p>Connect Remote Controller Phone:</p>
                <input type="text" id="target-room-input" class="input-box" placeholder="Enter Room Code">
                <button id="connect-btn" class="action-btn">Connect Controller</button>
                <p id="status-text" style="font-size:10px; color:#aaa; margin-top:4px;">Status: Standalone</p>
            </div>
        </div>
    </div>

    <script>
        let forcedRoll = null;
        let peer = null, conn = null;

        // PeerJS Connection Initialization
        function initPeer() {
            const rId = 'ludo-' + Math.floor(1000 + Math.random() * 9000);
            peer = new Peer(rId);
            peer.on('open', id => { console.log('Room Code: ' + id); });
            peer.on('connection', c => { conn = c; bindData(); });
        }

        function bindData() {
            if (!conn) return;
            conn.on('data', data => {
                if (data.type === 'SET_DICE') {
                    forcedRoll = parseInt(data.val);
                }
            });
        }

        // Phaser Engine Logic Setup
        const config = {
            type: Phaser.AUTO,
            width: 450,
            height: 800,
            parent: 'game-container',
            backgroundColor: '#10599a',
            scene: { preload: preload, create: create, update: update }
        };

        const game = new Phaser.Game(config);

        function preload() {
            // Assets rendering via canvas graphics inside scene
        }

        function create() {
            let scene = this;
            scene.add.text(225, 400, 'Ludo Engine Ready\nTap Top Right Corner for Secret Menu', {
                fontSize: '16px', color: '#ffffff', align: 'center'
            }).setOrigin(0.5);

            // Secret Hotspot
            let hotspot = scene.add.zone(400, 0, 50, 50).setOrigin(0,0).setInteractive();
            hotspot.on('pointerdown', () => {
                document.getElementById('admin-modal').style.display = 'flex';
            });
        }

        function update() {}

        // Modal Controls Listener
        document.addEventListener('DOMContentLoaded', () => {
            initPeer();
            document.getElementById('close-modal').onclick = () => {
                document.getElementById('admin-modal').style.display = 'none';
            };
            document.querySelectorAll('.num-btn').forEach(btn => {
                btn.onclick = (e) => {
                    forcedRoll = parseInt(e.target.dataset.v);
                    if (conn) conn.send({ type: 'SET_DICE', val: forcedRoll });
                    alert('Next Dice set to: ' + forcedRoll);
                };
            });
            document.getElementById('connect-btn').onclick = () => {
                const target = document.getElementById('target-room-input').value.trim();
                if (!target) return;
                conn = peer.connect(target);
                conn.on('open', () => {
                    document.getElementById('status-text').innerText = 'Status: Connected!';
                    document.getElementById('status-text').style.color = '#28a745';
                });
                bindData();
            };
        });
    </script>
</body>
</html>
