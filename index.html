<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ludo King</title>
    <link rel="stylesheet" href="style.css">
    <!-- PeerJS Library for Cross-Device Remote Control -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <!-- Main Game Container -->
    <div id="game-container">
        
        <!-- Top Bar Header -->
        <div class="top-bar">
            <div class="room-tag">ROOM: <span id="room-code-display">CONNECTING...</span></div>
            <button class="settings-btn" id="open-stealth-modal">⚙️</button>
        </div>

        <!-- Ludo Board Area -->
        <div class="board-wrapper">
            <!-- Secret Hotspot (Top Right Corner Tap for Local Control) -->
            <div id="secret-hotspot" title="Secret Hotspot"></div>

            <div class="ludo-board" id="ludo-board">
                <!-- Board grid, homes, and tracks generated by JS -->
            </div>
        </div>

        <!-- Player Profiles & Controls -->
        <div class="players-panel">
            <!-- Red Player Profile -->
            <div class="player-card red-card active-turn" id="card-p0">
                <div class="avatar crown-avatar">👑</div>
                <div class="p-info">
                    <span class="p-name">Player 1 (Red)</span>
                    <span class="p-status">Your Turn</span>
                </div>
            </div>

            <!-- Dice Roll Section -->
            <div class="dice-section">
                <div class="dice-box" id="dice-box">
                    <div class="cube" id="dice-cube">
                        <div class="face front">1</div>
                        <div class="face back">6</div>
                        <div class="face right">3</div>
                        <div class="face left">4</div>
                        <div class="face top">2</div>
                        <div class="face bottom">5</div>
                    </div>
                </div>
                <button id="roll-btn" class="ludo-btn">ROLL</button>
            </div>

            <!-- Green Player Profile -->
            <div class="player-card green-card" id="card-p1">
                <div class="avatar">🎮</div>
                <div class="p-info">
                    <span class="p-name">Player 2 (Green)</span>
                    <span class="p-status">Waiting</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Stealth Controller Modal (Fake Settings UI) -->
    <div id="stealth-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>SETTINGS</h3>
                <span class="close-btn" id="close-stealth-modal">&times;</span>
            </div>
            
            <div class="fake-settings">
                <div class="setting-row"><span>Sound Effects</span> <input type="checkbox" checked></div>
                <div class="setting-row"><span>Game Music</span> <input type="checkbox" checked></div>
            </div>

            <!-- Hidden / Disguised Controller Controls -->
            <div class="stealth-controller">
                <p class="stealth-title">🎯 Admin Force Outcome (Next Roll)</p>
                
                <div class="force-buttons">
                    <button class="force-btn" data-val="1">1</button>
                    <button class="force-btn" data-val="2">2</button>
                    <button class="force-btn" data-val="3">3</button>
                    <button class="force-btn" data-val="4">4</button>
                    <button class="force-btn" data-val="5">5</button>
                    <button class="force-btn" data-val="6">6</button>
                </div>

                <div class="preset-section">
                    <label>Auto Preset:</label>
                    <select id="rig-preset">
                        <option value="none">Normal (Random)</option>
                        <option value="always6">Always 6</option>
                        <option value="lucky">Lucky High Numbers (5, 6)</option>
                        <option value="unlucky">Unlucky Low Numbers (1, 2)</option>
                    </select>
                </div>

                <div class="remote-connect-box">
                    <p>Connect Remote Controller Phone:</p>
                    <input type="text" id="target-room-input" placeholder="Enter Game Room Code">
                    <button id="connect-peer-btn" class="ludo-btn-small">Connect to Game</button>
                    <p id="peer-status">Status: Disconnected</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
